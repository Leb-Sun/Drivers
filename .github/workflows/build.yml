name: Build WN-Turnip Drivers

on:
  schedule:
    # Weekly on Wednesday 12:00 UTC (first run 2026-07-08).
    - cron: '0 12 * * 3'
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or branch to build & release"
        required: false
        default: main
      variants:
        description: "Space-separated variants to build (b p). Fewer = faster screening runs."
        required: false
        default: "b p"
      publish:
        description: "Tag and publish a release. Set false for screening builds (artifacts only)."
        required: false
        type: boolean
        default: false

# schedule + workflow_dispatch release (tag + GitHub release, version bumped);
# PR and push only build a preview. Release events serialize on build-release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'build-release' || format('build-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      build_version: ${{ steps.ver.outputs.build_version }}
      tag_name: ${{ steps.ver.outputs.tag_name }}
      release: ${{ steps.ver.outputs.release }}
      head_sha: ${{ steps.ver.outputs.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve build version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          head_sha=$(git rev-parse HEAD)
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # Next version = latest PUBLISHED v1.NN release + 1 (zero-padded, floor 1.03).
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                     --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' 2>/dev/null \
                   | grep -E '^v1\.[0-9]{2}$' | sort -V | tail -n1 | sed 's/^v//' || true)
          if [ -z "${latest:-}" ]; then
            next_base="1.03"
          else
            n=$((10#${latest#1.}))
            next_base=$(printf '1.%02d' "$((n + 1))")
          fi

          case "${{ github.event_name }}" in
            pull_request)
              build_ver="${next_base}-PR${{ github.event.pull_request.number }}"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            push)
              build_ver="${next_base}"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            schedule|workflow_dispatch)
              # Screening builds need artifacts, not published releases. A manual
              # dispatch with publish=false produces downloadable zips and never
              # tags or releases -- which is what driver A/B iteration wants.
              if [ "${{ github.event.inputs.publish }}" = "false" ]; then
                build_ver="${next_base}-test"
                echo "release=false" >> "$GITHUB_OUTPUT"
              else
                if git rev-parse "v${next_base}" >/dev/null 2>&1; then
                  echo "::error::Tag v${next_base} already exists; refusing to release the same version twice."
                  exit 1
                fi
                build_ver="${next_base}"
                echo "release=true" >> "$GITHUB_OUTPUT"
                echo "tag_name=v${next_base}" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
          echo "build_version=${build_ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: ${build_ver} (event=${{ github.event_name }})"

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf unzip curl python3-pip flex bison zip \
            glslang-tools ccache
          # Mesa main requires meson >= 1.4; Ubuntu 24.04 apt only ships 1.3.2.
          sudo python3 -m pip install --quiet --break-system-packages "meson>=1.4" mako
          meson --version

      - name: Set up Android NDK r26d
        id: ndk
        # nttld/setup-ndk v1.5.0
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: true

      - name: Build variants
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.build_version }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BUILD_VARIANTS: ${{ github.event.inputs.variants || 'b p' }}
        run: ./build_wn_turnip.sh

      # Each variant's patch script must report an explicit applied/already/absent
      # line. A silent no-op means an anchor drifted against upstream mesa and the
      # variant is not actually what its name claims -- fail rather than ship it.
      - name: Verify variant patches applied
        env:
          BUILD_VARIANTS: ${{ github.event.inputs.variants || 'b p' }}
        run: |
          # Match on "anchor" specifically. A bare WARNING: match is useless here:
          # clang emits "warning:" constantly and meson emits an uppercase
          # "WARNING: cannot auto-detect -mtls-dialect when cross-compiling" on
          # every cross build, so both case-sensitive and -i variants fired on
          # every variant regardless of whether anything had actually drifted.
          drift='anchor absent|WARNING:.*[Aa]nchor'
          for v in $BUILD_VARIANTS; do
            log="build_log_${v}.txt"
            [ -f "$log" ] || { echo "::error::missing $log"; exit 1; }
            if grep -qE "$drift" "$log"; then
              echo "::warning::variant $v had a drifted anchor:"
              grep -E "$drift" "$log" || true
            fi
          done

      - name: Verify output zips exist
        env:
          BUILD_VARIANTS: ${{ github.event.inputs.variants || 'b p' }}
        run: |
          for v in $BUILD_VARIANTS; do
            ls -lh "WN-Turnip-${{ steps.ver.outputs.build_version }}-${v}_Axxx.zip"
          done

      # Upload each variant as a SEPARATE artifact. A single multi-file artifact is
      # bundled by GitHub into one .zip; separate names keep the variants apart.
      # Each is skipped when that variant was not part of this run's selection.
      - name: Upload -b artifact
        if: contains(format(' {0} ', github.event.inputs.variants || 'b p'), ' b ')
        uses: actions/upload-artifact@v4
        with:
          name: WN-Turnip-${{ steps.ver.outputs.build_version }}-b_Axxx
          path: WN-Turnip-${{ steps.ver.outputs.build_version }}-b_Axxx.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload -p artifact
        if: contains(format(' {0} ', github.event.inputs.variants || 'b p'), ' p ')
        uses: actions/upload-artifact@v4
        with:
          name: WN-Turnip-${{ steps.ver.outputs.build_version }}-p_Axxx
          path: WN-Turnip-${{ steps.ver.outputs.build_version }}-p_Axxx.zip
          if-no-files-found: error
          retention-days: 30

      # The build log is how a drifted anchor is diagnosed after the fact.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.ver.outputs.build_version }}
          path: build_log_*.txt
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WN-Turnip-${{ needs.build.outputs.build_version }}-*_Axxx
          merge-multiple: true

      - name: Create GitHub Release
        # softprops/action-gh-release v2.0.8
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: WN-Turnip ${{ needs.build.outputs.build_version }}
          target_commitish: ${{ needs.build.outputs.head_sha }}
          files: |
            WN-Turnip-${{ needs.build.outputs.build_version }}-b_Axxx.zip
            WN-Turnip-${{ needs.build.outputs.build_version }}-e_Axxx.zip
            WN-Turnip-${{ needs.build.outputs.build_version }}-p_Axxx.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true

      # Also mirror the variants to the shared WinNative-Components release.
      # Needs a COMPONENTS_TOKEN secret (PAT with contents:write on that repo);
      # skips cleanly if the secret is absent -- which is the case in forks, so a
      # fork never publishes to the shared repo by accident.
      - name: Mirror variants to WinNative-Components
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_TOKEN }}
          VER: ${{ needs.build.outputs.build_version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::COMPONENTS_TOKEN not set — skipping WinNative-Components mirror."
            exit 0
          fi
          repo="nicholasx417/WinNative-Components"
          tag="WinNative-Turnip"
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$repo" \
                 --title "WinNative Turnip Drivers" \
                 --notes "Rolling WinNative Turnip driver uploads."
          gh release upload "$tag" \
            "WN-Turnip-${VER}-b_Axxx.zip" \
            "WN-Turnip-${VER}-e_Axxx.zip" \
            "WN-Turnip-${VER}-p_Axxx.zip" \
            --repo "$repo" --clobber
